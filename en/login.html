<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Sign in to your account – Micolpe</title>
  <meta name="description" content="Sign in to your Micolpe account to view your profile, loft, devices and pigeons.">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/portal.css">
  <link rel="icon" href="../assets/img/logo.png">
</head>
<body>
  <header class="topbar account-topbar"><div class="container nav">
    <a class="brand" href="index.html"><img src="../assets/img/logo.png" alt="Micolpe logo"><span>Micolpe</span></a>
    <nav class="account-nav" aria-label="Account navigation"><a href="index.html">Back to website</a><a class="btn secondary small" href="register.html">Create an account</a></nav>
  </div></header>
  <main class="account-main"><div class="auth-layout">
    <section class="auth-story" aria-label="Micolpe"><span class="badge">Micolpe member area</span><h1>Your loft,<span>wherever you are</span></h1><p>View the essential information from your Micolpe account in your browser.</p></section>
    <section class="auth-panel" aria-labelledby="login-title">
      <h1 id="login-title">Welcome back</h1><p>Sign in with the same account you use in the Micolpe application.</p>
      <form class="auth-form" id="login-form" novalidate>
        <div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" inputmode="email" required></div>
        <div class="form-field"><label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" id="toggle-password" type="button" aria-pressed="false">Show</button></div></div>
        <div class="auth-status info" id="login-status" role="status" aria-live="polite" hidden></div>
        <button class="btn primary auth-submit" id="login-submit" type="submit"><span class="button-label">Sign in</span></button>
      </form>
      <p class="auth-switch">No account yet? <a href="register.html">Start your 15-day trial</a></p>
    </section>
  </div></main>
  <script src="../assets/js/supabase-config.js"></script>
  <script type="module" src="../assets/js/login.js"></script>
</body>
</html>
