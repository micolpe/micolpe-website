<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Create an account – Micolpe</title>
  <meta name="description" content="Create your Micolpe account and start your 15-day free trial.">
  <link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/portal.css"><link rel="icon" href="../assets/img/logo.png">
</head>
<body>
  <header class="topbar account-topbar"><div class="container nav"><a class="brand" href="index.html"><img src="../assets/img/logo.png" alt="Micolpe logo"><span>Micolpe</span></a><nav class="account-nav" aria-label="Account navigation"><a href="index.html">Back to website</a><a class="btn secondary small" href="login.html">Sign in</a></nav></div></header>
  <main class="account-main"><div class="auth-layout">
    <section class="auth-story" aria-label="Micolpe"><span class="badge">15-day free trial</span><h1>Get started<span>simply</span></h1><p>One account gives you access to Micolpe on Android, Windows and the Web.</p></section>
    <section class="auth-panel" aria-labelledby="register-title">
      <h1 id="register-title">Create your account</h1><p>Use an email address you can access. We will send you a confirmation link.</p>
      <form class="auth-form" id="register-form" novalidate>
        <div class="form-field"><label for="full-name">Full name</label><input id="full-name" name="fullName" type="text" autocomplete="name" maxlength="120" required></div>
        <div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" inputmode="email" required></div>
        <div class="form-field"><label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required><button class="password-toggle" id="toggle-password" type="button" aria-pressed="false">Show</button></div><p class="form-hint">At least 6 characters.</p></div>
        <div class="form-field"><label for="password-confirmation">Confirm password</label><div class="password-field"><input id="password-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="6" required><button class="password-toggle" id="toggle-password-confirmation" type="button" aria-pressed="false">Show</button></div></div>
        <div class="auth-status info" id="register-status" role="status" aria-live="polite" hidden></div>
        <button class="btn primary auth-submit" id="register-submit" type="submit"><span class="button-label">Create my account</span></button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </section>
  </div></main>
  <script src="../assets/js/supabase-config.js"></script><script type="module" src="../assets/js/register.js"></script>
</body>
</html>
